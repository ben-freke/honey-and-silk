# Weekly dependency update pull requests. Minor and patch updates are grouped to keep the number of PRs small.
# Major versions (for example Astro, Tailwind or ESLint) come as separate PRs, because they need migration work.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
